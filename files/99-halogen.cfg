# Keep the OS's boot options and add the GPU settings for 128 GB Strix Halo hosts.
for halogen_arg in amd_iommu=off amdgpu.gttsize=126976 ttm.pages_limit=32505856; do
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *" $halogen_arg "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:-} $halogen_arg" ;;
    esac
done
unset halogen_arg
